<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ageGuess</title>
  <meta name="description" content="Guess how old celebrities and athletes were when their photo was taken. Closer guesses score more points.">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="home.js"></script>
</head>
<body>
  <nav class="nav">
    <a href="./" class="brand">ageGuess 🤔</a>
  </nav>

  <main class="home">
    <img src="images/logo.png" alt="" class="hero-logo">
    <h1>GUESS PEOPLE'S AGE!</h1>
    <p class="lede">
      Five photos a game. Slide to guess how old each person was when the photo was taken.
      The closer you get, the more points you score, up to 25,000.
    </p>
    <div class="modes" id="modes"></div>
  </main>

  <footer class="footer">
    Photos and dates from <a href="https://commons.wikimedia.org">Wikimedia Commons</a> and
    <a href="https://www.wikidata.org">Wikidata</a> ·
    <a href="https://github.com/reddoy/age-guess">Source on GitHub</a>
  </footer>
</body>
</html>
